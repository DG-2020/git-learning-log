# File: .github/workflows/plan-gate.yml
name : Plan Gate

on:
    pull_request:
        branches: [ main ]

jobs:
    require_plan:
        runs-on: ubuntu-latest
        steps: 
            - uses: actions/checkout@v4

            - name: Require Plan Artifact
              run: |
                if: [ ! -f "Github/pull_request_templet.md" ]; then 
                    echo "Github/pull_request_templet.md is required for this pull request."
                    exit 1
                fi 
                echo "Github/pull_request_templet.md found."
                 